<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ryan's Blog</title>
  <desc id="desc">A personal blog about code, building, writing and life.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.48" stop-color="#102a43"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="180" cy="40" r="240" fill="url(#glow)"/>
  <circle cx="1080" cy="330" r="300" fill="url(#glow)" opacity=".62"/>
  <g opacity=".8">
    <circle cx="1040" cy="84" r="5" fill="#38bdf8"/>
    <circle cx="1080" cy="116" r="3" fill="#a78bfa"/>
    <circle cx="1000" cy="132" r="3" fill="#f472b6"/>
    <path d="M940 86h44M962 64v44" stroke="#ffffff" stroke-opacity=".38" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="66" y="64" width="76" height="76" rx="22" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".22"/>
    <path d="M87 103l12 12 25-30" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="66" y="202" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2">Ryan's Blog</text>
  <text x="69" y="245" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="4">CODE · BUILD · WRITE · LIVE</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="68" y="283" width="104" height="36" rx="18" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="91" y="307" fill="#e2e8f0">Hexo 8</text>
    <rect x="184" y="283" width="126" height="36" rx="18" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="206" y="307" fill="#e2e8f0">Butterfly 5</text>
    <rect x="322" y="283" width="154" height="36" rx="18" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="344" y="307" fill="#e2e8f0">GitHub Pages</text>
  </g>
</svg>