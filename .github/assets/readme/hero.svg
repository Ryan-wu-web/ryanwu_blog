<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ryanwu Blog</title>
  <desc id="desc">Ryanwu's personal blog about AI, technology and life, presented in a restrained dark copper visual style.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090908"/>
      <stop offset="0.52" stop-color="#161310"/>
      <stop offset="1" stop-color="#2b2119"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6747"/>
      <stop offset="0.5" stop-color="#c69a68"/>
      <stop offset="1" stop-color="#76563b"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c69a68" stop-opacity=".24"/>
      <stop offset="1" stop-color="#c69a68" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 1h5M1 0v5" stroke="#fff" stroke-opacity=".018" stroke-width=".5"/>
    </pattern>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d8b48b" stroke-opacity=".045"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grain)"/>
  <circle cx="1040" cy="170" r="290" fill="url(#warmGlow)"/>
  <circle cx="1030" cy="206" r="168" fill="none" stroke="#c69a68" stroke-opacity=".17"/>
  <circle cx="1030" cy="206" r="118" fill="none" stroke="#c69a68" stroke-opacity=".12"/>
  <circle cx="1030" cy="206" r="68" fill="none" stroke="#c69a68" stroke-opacity=".22"/>
  <path d="M862 206h336M1030 38v336" stroke="#c69a68" stroke-opacity=".08"/>

  <g filter="url(#softShadow)">
    <rect x="68" y="64" width="58" height="58" rx="16" fill="#1d1814" stroke="#c69a68" stroke-opacity=".46"/>
    <path d="M85 104V82h13.5c8 0 13.5 4.1 13.5 11 0 4.8-2.6 8.1-7 9.7l9 13.3h-10l-7.5-12H94v12h-9zm9-8h4c3.4 0 5.5-1.2 5.5-3.7S101.4 89 98 89h-4z" fill="url(#copper)"/>
  </g>

  <text x="68" y="194" fill="#f0e9e0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="720" letter-spacing="-2.5">RYANWU</text>
  <text x="70" y="244" fill="#c69a68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="7">AI / TECHNOLOGY / LIFE</text>
  <rect x="70" y="274" width="470" height="1" fill="url(#copper)" opacity=".7"/>
  <text x="70" y="312" fill="#a99e91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing=".4">Thinking clearly. Building carefully. Recording honestly.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.4">
    <rect x="69" y="342" width="112" height="34" rx="17" fill="#c69a68" fill-opacity=".08" stroke="#c69a68" stroke-opacity=".25"/>
    <text x="91" y="364" fill="#cdb291">THINK</text>
    <rect x="193" y="342" width="112" height="34" rx="17" fill="#c69a68" fill-opacity=".08" stroke="#c69a68" stroke-opacity=".25"/>
    <text x="218" y="364" fill="#cdb291">BUILD</text>
    <rect x="317" y="342" width="128" height="34" rx="17" fill="#c69a68" fill-opacity=".08" stroke="#c69a68" stroke-opacity=".25"/>
    <text x="338" y="364" fill="#cdb291">RECORD</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#b7aa9d">
    <text x="900" y="92" font-size="12" letter-spacing="2.4">PERSONAL ARCHIVE</text>
    <text x="900" y="334" font-size="12" letter-spacing="2.4">RYANWU.CN</text>
    <circle cx="1030" cy="206" r="7" fill="#c69a68"/>
    <circle cx="1030" cy="206" r="18" fill="none" stroke="#c69a68" stroke-opacity=".35"/>
  </g>

  <rect x=".5" y=".5" width="1199" height="419" rx="29.5" fill="none" stroke="#c69a68" stroke-opacity=".18"/>
</svg>
