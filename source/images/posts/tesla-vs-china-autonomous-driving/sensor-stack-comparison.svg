<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">视觉优先与多传感器融合路线对比</title><desc id="desc">左侧为 Tesla 代表的视觉优先路线，右侧为国内常见多传感器融合路线，两者最终都进入统一模型和车辆控制。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c0f"/><stop offset="1" stop-color="#1c120d"/></linearGradient><linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b2420"/><stop offset="1" stop-color="#151517"/></linearGradient><linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#30231c"/><stop offset="1" stop-color="#171516"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".42"/></filter></defs>
<rect width="1280" height="760" rx="30" fill="url(#bg)"/><text x="64" y="72" fill="#f2e7de" font-size="34" font-family="Microsoft YaHei, sans-serif" font-weight="700">两条路线，差别在信息来源和风险分配</text><text x="64" y="110" fill="#aa998c" font-size="18" font-family="Microsoft YaHei, sans-serif">示意图只表达典型思路，具体车型与版本可能采用不同配置</text>
<g transform="translate(64 150)" font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)"><rect width="550" height="510" rx="26" fill="url(#left)" stroke="#b8754b" stroke-opacity=".55"/><text x="36" y="53" fill="#e6b58e" font-size="17" font-weight="700" letter-spacing="2">VISION-FIRST</text><text x="36" y="91" fill="#f4e9e0" font-size="29" font-weight="700">视觉优先路线</text><text x="36" y="122" fill="#b9a69a" font-size="16">以 Tesla 量产驾驶辅助路线为代表</text>
<g transform="translate(36 158)"><rect width="478" height="74" rx="15" fill="#151517" stroke="#9a6445"/><circle cx="39" cy="37" r="17" fill="#c98252"/><circle cx="39" cy="37" r="7" fill="#151517"/><text x="72" y="32" fill="#f0e4db" font-size="19" font-weight="700">多摄像头 + 车身状态 + 导航</text><text x="72" y="55" fill="#a99486" font-size="14">主要环境语义来自连续视觉</text></g>
<path d="M275 242v42" stroke="#d08b5b" stroke-width="2"/><path d="m268 277 7 9 7-9" fill="none" stroke="#d08b5b" stroke-width="2"/>
<g transform="translate(36 286)"><rect width="478" height="86" rx="15" fill="#1b1716" stroke="#ad7048"/><text x="239" y="36" text-anchor="middle" fill="#f0e4db" font-size="19" font-weight="700">时序视觉模型 / 端到端网络</text><text x="239" y="62" text-anchor="middle" fill="#a99486" font-size="14">从图像理解三维、预测道路参与者并生成决策</text></g>
<path d="M275 382v42" stroke="#d08b5b" stroke-width="2"/><path d="m268 417 7 9 7-9" fill="none" stroke="#d08b5b" stroke-width="2"/>
<g transform="translate(36 428)"><rect width="478" height="52" rx="14" fill="#c98252" fill-opacity=".14" stroke="#c98252"/><text x="239" y="33" text-anchor="middle" fill="#f1ddd0" font-size="17" font-weight="700">规模化关键：车队数据 · 训练算力 · 长尾验证</text></g></g>
<g transform="translate(666 150)" font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)"><rect width="550" height="510" rx="26" fill="url(#right)" stroke="#d29569" stroke-opacity=".62"/><text x="36" y="53" fill="#edbd94" font-size="17" font-weight="700" letter-spacing="2">SENSOR FUSION</text><text x="36" y="91" fill="#f4e9e0" font-size="29" font-weight="700">多传感器融合路线</text><text x="36" y="122" fill="#b9a69a" font-size="16">国内多款量产车型与 Robotaxi 常见思路</text>
<g transform="translate(36 158)"><rect width="478" height="74" rx="15" fill="#171516" stroke="#b77a50"/><g fill="#d99c70"><circle cx="25" cy="37" r="8"/><circle cx="50" cy="37" r="8"/><circle cx="75" cy="37" r="8"/></g><text x="104" y="32" fill="#f0e4db" font-size="18" font-weight="700">摄像头 + 激光雷达 + 毫米波雷达</text><text x="104" y="55" fill="#a99486" font-size="14">再叠加 GNSS / IMU 等定位与运动信息</text></g>
<path d="M275 242v42" stroke="#d99c70" stroke-width="2"/><path d="m268 277 7 9 7-9" fill="none" stroke="#d99c70" stroke-width="2"/>
<g transform="translate(36 286)"><rect width="478" height="86" rx="15" fill="#1d1815" stroke="#c38255"/><text x="239" y="36" text-anchor="middle" fill="#f0e4db" font-size="19" font-weight="700">多模态融合模型 / 端到端网络</text><text x="239" y="62" text-anchor="middle" fill="#a99486" font-size="14">融合语义、几何、距离和速度，处理信息冲突</text></g>
<path d="M275 382v42" stroke="#d99c70" stroke-width="2"/><path d="m268 417 7 9 7-9" fill="none" stroke="#d99c70" stroke-width="2"/>
<g transform="translate(36 428)"><rect width="478" height="52" rx="14" fill="#d99c70" fill-opacity=".14" stroke="#d99c70"/><text x="239" y="33" text-anchor="middle" fill="#f1ddd0" font-size="17" font-weight="700">规模化关键：融合质量 · 标定同步 · 成本与验证</text></g></g>
<g font-family="Microsoft YaHei, sans-serif"><path d="M617 690h46" stroke="#8d6b55" stroke-width="2"/><circle cx="640" cy="690" r="7" fill="#d39568"/><text x="640" y="724" text-anchor="middle" fill="#aa998c" font-size="16">最终目标相同：稳定理解环境，并安全控制车辆</text></g>
</svg>