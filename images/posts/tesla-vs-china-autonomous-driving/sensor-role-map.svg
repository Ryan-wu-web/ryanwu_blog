<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">智驾传感器职责图</title><desc id="desc">展示摄像头、激光雷达、毫米波雷达、GNSS 和 IMU 的职责，以及它们如何共同进入感知定位和决策系统。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d10"/><stop offset="1" stop-color="#1a120e"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#24201d"/><stop offset="1" stop-color="#151516"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter></defs>
<rect width="1280" height="720" rx="30" fill="url(#bg)"/><text x="72" y="78" fill="#f1e7df" font-size="34" font-family="Microsoft YaHei, sans-serif" font-weight="700">智驾系统不是只靠一种“眼睛”</text><text x="72" y="116" fill="#aa9a8f" font-size="18" font-family="Microsoft YaHei, sans-serif">不同传感器提供不同维度的信息，模型负责把它们变成可执行的判断</text>
<g font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)">
<g transform="translate(65 165)"><rect width="210" height="190" rx="18" fill="url(#card)" stroke="#c98252" stroke-opacity=".55"/><circle cx="36" cy="37" r="14" fill="#c98252"/><circle cx="36" cy="37" r="6" fill="#171719"/><text x="64" y="45" fill="#f4e8df" font-size="23" font-weight="700">摄像头</text><text x="24" y="89" fill="#d4c4b8" font-size="16">颜色 · 纹理 · 语义</text><text x="24" y="119" fill="#d4c4b8" font-size="16">车道线 · 红绿灯</text><text x="24" y="158" fill="#a58f81" font-size="14">像“眼睛”，信息丰富</text></g>
<g transform="translate(300 165)"><rect width="210" height="190" rx="18" fill="url(#card)" stroke="#d99a6b" stroke-opacity=".55"/><path d="M26 43h22M37 32v22M25 31l24 24M49 31L25 55" stroke="#d99a6b" stroke-width="3"/><text x="64" y="45" fill="#f4e8df" font-size="23" font-weight="700">激光雷达</text><text x="24" y="89" fill="#d4c4b8" font-size="16">三维几何 · 距离</text><text x="24" y="119" fill="#d4c4b8" font-size="16">轮廓 · 空间结构</text><text x="24" y="158" fill="#a58f81" font-size="14">像高速扫描的尺子</text></g>
<g transform="translate(535 165)"><rect width="210" height="190" rx="18" fill="url(#card)" stroke="#b8754b" stroke-opacity=".55"/><path d="M27 49c15-15 28-15 43 0M33 42c10-9 19-9 29 0M40 35c5-4 9-4 14 0" fill="none" stroke="#c98252" stroke-width="3"/><text x="76" y="45" fill="#f4e8df" font-size="22" font-weight="700">毫米波雷达</text><text x="24" y="89" fill="#d4c4b8" font-size="16">距离 · 相对速度</text><text x="24" y="119" fill="#d4c4b8" font-size="16">部分天气适应性</text><text x="24" y="158" fill="#a58f81" font-size="14">测速强，语义细节少</text></g>
<g transform="translate(770 165)"><rect width="210" height="190" rx="18" fill="url(#card)" stroke="#a96d49" stroke-opacity=".55"/><path d="M37 27c-12 0-20 8-20 19 0 15 20 34 20 34s20-19 20-34c0-11-8-19-20-19Zm0 12a7 7 0 1 1 0 14 7 7 0 0 1 0-14Z" fill="#c98252"/><text x="68" y="45" fill="#f4e8df" font-size="23" font-weight="700">GNSS / GPS</text><text x="24" y="89" fill="#d4c4b8" font-size="16">全局位置 · 时间</text><text x="24" y="119" fill="#d4c4b8" font-size="16">导航 · 地图匹配</text><text x="24" y="158" fill="#a58f81" font-size="14">知道在哪，不负责看路</text></g>
<g transform="translate(1005 165)"><rect width="210" height="190" rx="18" fill="url(#card)" stroke="#8d634b" stroke-opacity=".55"/><path d="M36 28v34M19 45h34M25 34l22 22M47 34L25 56" stroke="#c98252" stroke-width="3"/><text x="68" y="45" fill="#f4e8df" font-size="23" font-weight="700">IMU / 轮速</text><text x="24" y="89" fill="#d4c4b8" font-size="16">加速度 · 角速度</text><text x="24" y="119" fill="#d4c4b8" font-size="16">短时运动 · 姿态</text><text x="24" y="158" fill="#a58f81" font-size="14">连续追踪车辆怎么动</text></g>
</g>
<g stroke="#b97a52" stroke-width="2" stroke-opacity=".42" fill="none"><path d="M170 374v62h470"/><path d="M405 374v62h235"/><path d="M640 374v62"/><path d="M875 374v62H640"/><path d="M1110 374v62H640"/></g><circle cx="640" cy="436" r="7" fill="#d09368"/>
<g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif"><rect x="282" y="482" width="716" height="146" rx="24" fill="#211b18" stroke="#d09368" stroke-opacity=".6"/><text x="640" y="535" text-anchor="middle" fill="#f3e8df" font-size="26" font-weight="700">感知 · 定位 · 预测 · 规划 · 控制</text><text x="640" y="577" text-anchor="middle" fill="#c9b7aa" font-size="18">传感器只是输入，真正的体验取决于模型、数据、算力和安全工程</text></g>
</svg>